<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Media</title>
    <link rel="icon" href="/assets/favicon-AGotJyxA.ico" />
    <script>
      window.WORLDMEDIA_PROXY = "/api/proxy?url=";
    </script>
    <script type="module" crossorigin src="/assets/index-QzKo98u1.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CY7vS4cL.css">
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-glyph" aria-hidden="true"></span>
          <span class="brand-name">World Media</span>
        </div>
        <nav class="modes" id="modes-nav" aria-label="Primary views">
          <button class="mode-btn is-active" data-mode="library" aria-current="page">Library</button>
          <button class="mode-btn" data-mode="tuner">Tuner</button>
          <button class="mode-btn" data-mode="grid">Grid</button>
          <button class="mode-btn" data-mode="discovery">Discovery</button>
          <button class="mode-btn" data-mode="now-playing">Now Playing</button>
          <button class="mode-btn" data-mode="visualizer">Visualizer</button>
          <button class="mode-btn" data-mode="about">About</button>
        </nav>
        <div class="topbar-tools">
          <div id="sleep-timer" class="sleep-timer"></div>
          <button id="song-log-btn" class="icon-btn" type="button" title="Song log" aria-label="Song log">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
          </button>
          <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
          <button id="shutdown-btn" class="shutdown-btn" title="Shut down World Media" aria-label="Shut down">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
              <line x1="12" y1="2" x2="12" y2="12"/>
            </svg>
            <span>Shutdown</span>
          </button>
        </div>
      </header>

      <main id="view-host" class="view-host">
        <div class="boot-state">
          <div class="boot-spinner" aria-hidden="true"></div>
          <p>Starting World Media…</p>
        </div>
      </main>

      <footer id="player-bar" class="player-bar" hidden>
        <div class="player-primary">
          <div class="player-meta">
            <div class="player-art-box">
              <span id="player-art-initials" class="player-art-initials" aria-hidden="true" hidden></span>
              <img id="player-art" alt="" />
            </div>
            <div class="player-text">
              <div id="player-title" class="player-title"></div>
              <div id="player-resume-actions" class="player-resume-actions" role="group" aria-label="Resume playback" hidden>
                <button id="player-resume-part" class="btn btn-primary" type="button">Resume</button>
                <button id="player-start-over" class="btn" type="button">Start over</button>
              </div>
              <div class="player-source-row">
                <div id="player-source" class="player-source"></div>
                <button id="player-song-star" class="player-song-star" type="button" title="Star this song" aria-label="Star this song" aria-pressed="false" hidden>
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                  </svg>
                </button>
              </div>
            </div>
            <button id="player-fav" class="player-fav" type="button" title="Add to favorites" aria-label="Add to favorites" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
            </button>
          </div>
          <div class="player-controls">
            <button id="player-play" class="player-btn" aria-label="Play" aria-pressed="false" title="Play">
              <svg id="icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="icon-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>
            <button id="player-stop" class="player-btn" aria-label="Stop" title="Stop">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
            </button>
            <button id="player-next-broken" class="player-btn" hidden title="Try next source">Try next</button>
            <span id="player-previous-part-slot" class="player-part-slot" hidden>
              <button id="player-previous-part" class="player-btn player-part-button" type="button" aria-label="Previous part" title="Previous part" hidden disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3 6 9-6v12z"/></svg>
              </button>
            </span>
            <span id="player-next-part-slot" class="player-part-slot" hidden>
              <button id="player-next-part" class="player-btn player-part-button" type="button" aria-label="Next part" title="Next part" hidden disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM6 6l9 6-9 6z"/></svg>
              </button>
            </span>
          </div>
        </div>
        <div class="player-actions" aria-label="Media actions">
          <button id="player-capture" class="player-action" type="button" data-state="unavailable" disabled aria-disabled="true" aria-describedby="player-capture-hint">
            <span class="capture-icon" aria-hidden="true">
              <svg class="capture-icon-download" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
              <svg class="capture-icon-record" viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
              <svg class="capture-icon-stop" viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </span>
            <span id="player-capture-label" class="player-action-label">Unavailable</span>
          </button>
          <!-- The Record button's full hint (its hover text too); lib/capture-ui.js. -->
          <span id="player-capture-hint" hidden></span>
          <button id="player-capture-secondary" class="player-action-secondary" type="button" hidden></button>
          <!-- Shown only while a capture is under way, done or failed: its
               progress, result or error, on the same line as the buttons. -->
          <div id="player-capture-status" class="player-capture-status" hidden>
            <span id="player-capture-status-text"></span>
            <div id="player-capture-progress" class="player-capture-progress" role="progressbar" aria-label="Capture progress" aria-valuemin="0" aria-valuemax="100" hidden>
              <span id="player-capture-progress-bar"></span>
            </div>
          </div>
          <button id="player-eq" class="player-eq" type="button" aria-pressed="false" disabled>
            <span class="player-eq-label">EQ</span>
            <span id="player-eq-state" class="player-eq-state">Bypassed</span>
          </button>
          <span id="player-picture-slot" class="player-picture-slot" inert>
            <button id="player-picture" class="player-picture" type="button" popovertarget="picture-panel">Picture</button>
          </span>
        </div>
        <span id="player-capture-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
        <div class="player-progress">
          <div id="player-meter" class="player-meter" data-player-meter aria-hidden="true">
            <canvas class="player-meter-canvas" width="90" height="36"></canvas>
          </div>
          <span id="player-time" class="player-time">--:--</span>
          <input id="player-seek" class="player-seek" type="range" min="0" max="100" value="0" aria-label="Seek position" disabled />
          <span id="player-dur" class="player-time">--:--</span>
        </div>
        <div class="player-volume">
          <button id="player-mute" class="player-btn" aria-label="Mute" aria-pressed="false" data-silent="false" title="Mute">
            <svg class="icon-sound" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05a4.5 4.5 0 0 0 2.5-4.02z"/></svg>
            <svg class="icon-silent" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="m15.5 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <!-- The volume: up, the level (0-100) and down, in a column on the
               wide bar (lib/volume-stepper.js). The hidden input holds the
               user's level for lib/player.js. -->
          <div id="player-volume-control" class="volume-stepper" role="group" aria-label="Volume" title="Volume 80%" tabindex="-1">
            <button id="player-volume-up" class="volume-step" type="button" aria-label="Volume up" title="Volume up">
              <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 6.5 5 3.5 8 6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <output id="player-volume-readout" class="volume-led" aria-live="polite" aria-label="Volume 80">80</output>
            <button id="player-volume-down" class="volume-step" type="button" aria-label="Volume down" title="Volume down">
              <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <input id="player-volume" type="range" min="0" max="100" value="80" aria-label="Volume" hidden />
        </div>
      </footer>

      <div id="video-dock" class="video-dock">
        <video id="video-el" hidden playsinline controls controlslist="nodownload"></video>
        <button id="video-size-btn" class="video-size-btn" type="button" aria-pressed="false" aria-label="Larger video" title="Larger video">
          <svg class="icon-larger" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M21 11V3h-8l3.29 3.29-10 10L3 13v8h8l-3.29-3.29 10-10z"/></svg>
          <svg class="icon-smaller" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M22 3.41 16.71 8.7 20 12h-8V4l3.29 3.29L20.59 2 22 3.41zM3.41 22l5.29-5.29L12 20v-8H4l3.29 3.29L2 20.59 3.41 22z"/></svg>
        </button>
      </div>
      <div id="picture-panel" class="picture-panel" popover="auto" role="dialog" aria-labelledby="picture-heading">
        <h2 id="picture-heading">Picture</h2>
        <label for="picture-scope">Apply to</label>
        <select id="picture-scope" autofocus>
          <option id="picture-scope-channel" value="channel">For this channel</option>
          <option value="all">For all video</option>
        </select>
        <label for="picture-brightness">Brightness</label>
        <input id="picture-brightness" type="range" min="0" max="200" value="100" />
        <label for="picture-contrast">Contrast</label>
        <input id="picture-contrast" type="range" min="0" max="200" value="100" />
        <label for="picture-saturation">Saturation</label>
        <input id="picture-saturation" type="range" min="0" max="200" value="100" />
        <label for="picture-hue">Hue</label>
        <input id="picture-hue" type="range" min="-180" max="180" value="0" />
        <label for="picture-fit">Fit</label>
        <select id="picture-fit">
          <option value="whole">Whole picture</option>
          <option value="fill">Fill</option>
          <option value="zoom-110">Zoom 110%</option>
          <option value="zoom-125">Zoom 125%</option>
          <option value="zoom-133">Zoom 133%</option>
        </select>
        <label for="picture-quality" id="picture-quality-label" hidden>Quality</label>
        <div id="picture-quality-row" class="picture-quality-row" hidden>
          <select id="picture-quality" aria-describedby="picture-quality-now picture-quality-hint"></select>
          <span id="picture-quality-now" hidden></span>
        </div>
        <p id="picture-quality-hint" hidden>Uses more data and processor time in the small picture.</p>
        <button id="picture-reset" class="btn" type="button">Reset</button>
        <p id="picture-session-note" hidden>For this session only. Channel settings save only for Favorites and My Playlists.</p>
        <p>Recordings and downloads are unaffected.</p>
        <p id="picture-feedback" role="status"></p>
      </div>
      <audio id="audio-el" hidden></audio>
    </div>

    <div id="modal-host"></div>

  </body>
</html>
